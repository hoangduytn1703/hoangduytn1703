name: Generate profile summary cards

on:
  schedule:
    - cron: "30 17 * * *" # 00:30 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Token mặc định của Actions: chỉ đếm repo public.
          # Muốn tính cả repo private: tạo fine-grained PAT, lưu secret SUMMARY_GITHUB_TOKEN rồi đổi dòng dưới.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          TIME_ZONE: Asia/Ho_Chi_Minh
          THEME: github_dark
          AUTO_PUSH: true
